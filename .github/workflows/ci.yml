# Static gates only. These need nothing but the checkout, Node and Windows PowerShell 5.1, so they
# run on GitHub's windows runner. The unit tests that drive a real WPS installation and the
# one-command e2e stay local on purpose - see AGENTS.md §3 and scripts/run-gates.mjs (the single
# source of the gate list; this job only calls it).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install the MCP build dependencies
        working-directory: mcp
        run: npm ci --no-audit --no-fund

      # 门禁清单的**唯一来源**是 scripts/run-gates.mjs（docs / verify / code / bridge / package / release 六组）。
      # CI 跑 release 组；发版前本地执行的是同一条命令（npm run gates:release），两边不会再各抄一份清单。
      - name: Static gates (single source: scripts/run-gates.mjs)
        run: npm run gates:ci
